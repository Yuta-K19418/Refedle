name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Verify code formatting
      run: dotnet format --verify-no-changes --verbosity diagnostic

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test with coverage
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        files: ./coverage/**/coverage.cobertura.xml
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: coverage-report
        path: ./coverage/**/coverage.cobertura.xml
        retention-days: 30

  aot-compilation-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            binary: refedle
          - os: macos-latest
            rid: osx-arm64
            binary: refedle
          - os: windows-latest
            rid: win-x64
            binary: refedle.exe

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Publish with Native AOT
      run: dotnet publish src/App/Refedle.App.csproj --configuration Release -r ${{ matrix.rid }} -p:Version=9.9.9

    - name: Verify AOT binary exists
      shell: bash
      run: |
        if [ -f "src/App/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.binary }}" ]; then
          echo "✓ Native AOT binary generated successfully"
          ls -lh "src/App/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.binary }}"
        else
          echo "✗ Native AOT binary not found"
          exit 1
        fi

    - name: Verify -p:Version propagates to the AOT binary
      shell: bash
      run: |
        binary="src/App/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.binary }}"
        output="$("$binary" --version)"
        output="${output%$'\r'}"
        if [ "$output" != "refedle 9.9.9" ]; then
          echo "✗ Unexpected version output: $output"
          exit 1
        fi
        echo "✓ -p:Version propagated to the AOT binary: $output"
